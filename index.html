<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Shadow Counter</title>
    <meta
      name="description"
      content="A camera-controlled robot boxing duel: guard with your hands and counter with the correct fist in a rainy cyberpunk street."
    />

    <meta property="og:type" content="website" />
    <meta property="og:image" content="./card.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <nav aria-label="Primary">
        <a href="./">影拳 Shadow Counter</a>
      </nav>
    </header>
    <main>
      <h1 class="visually-hidden">Shadow Counter</h1>
      <div id="stage" class="stage">
        <video id="camera-feed" class="camera-feed" playsinline muted></video>
        <canvas id="diagnostic-canvas" class="diagnostic-canvas"></canvas>
        <button id="aperture" class="aperture" type="button" aria-label="Activate camera and begin">
          <span class="aperture-ring" aria-hidden="true"></span>
        </button>
        <p id="camera-status" class="camera-status" role="status" aria-live="polite"></p>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
